name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zilobase_test
      ZILOBASE_SEARCH_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zilobase_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/search/postgres-image.mjs
      - run: docker run -d --name zilobase-ci-postgres -p 5432:5432 -e POSTGRES_DB=zilobase_test -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres zilobase-postgres:17.10-vector0.8.7
      - run: until docker exec zilobase-ci-postgres pg_isready -U postgres -d zilobase_test; do sleep 1; done
      - run: npm run db:migrate:production --workspace @zilobase/server
      - run: npm run verify:core
      - run: npm run lint
      - run: npm run verify:architecture

  runtime-adapters:
    name: Runtime adapters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: mkdir -p .test-results/adapters
      - run: npm test --workspace @zilobase/runtime-adapter -- --reporter=default --reporter=junit --outputFile=../../.test-results/adapters/node.xml
      - run: npm run test:workers --workspace @zilobase/runtime-adapter -- --reporter=default --reporter=junit --outputFile=../../.test-results/adapters/worker.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-adapter-results
          path: .test-results/adapters/
          if-no-files-found: warn

  automation-acceptance:
    name: Automation ${{ matrix.runtime }} acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/search/postgres-image.mjs
      - run: docker pull valkey/valkey:8-alpine
      - run: npm run test:automations:${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-${{ matrix.runtime }}-results
          path: .test-results/automations/
          if-no-files-found: warn

  background-recovery:
    name: Background recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/search/postgres-image.mjs
      - run: docker pull valkey/valkey:8-alpine
      - run: mkdir -p .test-results/background
      - run: npm run test:background:isolated 2>&1 | tee .test-results/background/recovery.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: background-recovery-results
          path: .test-results/background/
          if-no-files-found: warn

  search-acceptance:
    name: Search Node and Worker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/search/postgres-image.mjs
      - run: docker pull valkey/valkey:8-alpine
      - run: npm run test:search
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-runtime-results
          path: .test-results/search/
          if-no-files-found: warn

  search-browser:
    name: Search browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/search/postgres-image.mjs
      - run: docker pull valkey/valkey:8-alpine
      - run: npm run test:search:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-browser-results
          path: .test-results/search/
          if-no-files-found: warn
