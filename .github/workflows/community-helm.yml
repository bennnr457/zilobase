name: Community Helm gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: community-helm
      - name: Validate chart contract
        shell: bash
        run: |
          set -euo pipefail
          helm lint deploy/helm/zilobase
          if helm template community deploy/helm/zilobase --set-string realtime.existingSecret= >/tmp/missing-realtime.out 2>/tmp/missing-realtime.err; then
            echo "deployment rendered without a realtime broker Secret" >&2
            exit 1
          fi
          grep -q "realtime.existingSecret" /tmp/missing-realtime.err
          ha_rendered=$(helm template community deploy/helm/zilobase \
            --set replicaCount=2)
          grep -q "replicas: 2" <<<"$ha_rendered"
          grep -q "kind: PodDisruptionBudget" <<<"$ha_rendered"
          rendered=$(helm template community deploy/helm/zilobase)
          grep -q "name: REALTIME_REDIS_URL" <<<"$rendered"
          grep -q 'secretKeyRef: { name: "zilobase", key: "REALTIME_REDIS_URL" }' <<<"$rendered"
          dedicated=$(helm template community deploy/helm/zilobase \
            --set realtime.existingSecret=community-realtime)
          grep -q 'secretKeyRef: { name: "community-realtime", key: "REALTIME_REDIS_URL" }' <<<"$dedicated"
          test "$(grep -c 'ZILOBASE_EDITION_MIGRATIONS_DIR' <<<"$rendered")" -eq 0
          test "$(grep -c 'name: inspector' <<<"$rendered")" -eq 0
          debug=$(helm template community deploy/helm/zilobase \
            --set debug.enabled=true --set debug.port=9233)
          grep -q 'name: inspector' <<<"$debug"
          grep -q -- '--inspect=0.0.0.0:9233' <<<"$debug"
          service=$(helm template community deploy/helm/zilobase \
            --show-only templates/service.yaml \
            --set debug.enabled=true --set debug.port=9233)
          test "$(grep -c '9233' <<<"$service")" -eq 0
          if helm template invalid-http deploy/helm/zilobase \
            --set config.externalUrl=http://community.localhost:3200 >/dev/null 2>&1; then
            echo "production values accepted an HTTP external URL" >&2
            exit 1
          fi
          helm template development deploy/helm/zilobase \
            --set development.enabled=true \
            --set config.externalUrl=http://community.localhost:3200 \
            --set config.s3Endpoint=http://rustfs:9000 \
            --set config.s3PublicEndpoint=http://127.0.0.1:3210 >/dev/null
      - name: Build and load immutable Community image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag ghcr.io/zilobase/zilobase:community-helm-ci .
          digest=$(docker image inspect ghcr.io/zilobase/zilobase:community-helm-ci --format '{{.Id}}')
          echo "COMMUNITY_DIGEST=$digest" >> "$GITHUB_ENV"
          kind load docker-image ghcr.io/zilobase/zilobase:community-helm-ci --name community-helm
          for node in $(kind get nodes --name community-helm); do
            docker exec "$node" ctr -n k8s.io images tag \
              ghcr.io/zilobase/zilobase:community-helm-ci \
              "ghcr.io/zilobase/zilobase@$digest"
          done
      - run: node scripts/search/postgres-image.mjs
      - name: Start external PostgreSQL, TLS RustFS, and Valkey
        shell: bash
        run: |
          set -euo pipefail
          postgres_password=$(openssl rand -hex 24)
          rustfs_password=$(openssl rand -hex 32)
          docker run -d --name community-helm-valkey --network kind \
            valkey/valkey:8-alpine valkey-server --save "" --appendonly no
          until docker exec community-helm-valkey valkey-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done
          docker run -d --name community-helm-postgres --network kind \
            -e POSTGRES_DB=zilobase \
            -e POSTGRES_PASSWORD="$postgres_password" \
            -e POSTGRES_USER=zilobase \
            zilobase-postgres:17.10-vector0.8.7
          until docker exec community-helm-postgres pg_isready -U zilobase -d zilobase >/dev/null 2>&1; do sleep 1; done

          mkdir -p "$RUNNER_TEMP/community-rustfs-tls"
          chmod 755 "$RUNNER_TEMP/community-rustfs-tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "$RUNNER_TEMP/community-rustfs-tls/rustfs_key.pem" \
            -out "$RUNNER_TEMP/community-rustfs-tls/rustfs_cert.pem" \
            -days 2 -subj "/CN=rustfs.external.svc.cluster.local" \
            -addext "subjectAltName=DNS:rustfs,DNS:rustfs.external,DNS:rustfs.external.svc,DNS:rustfs.external.svc.cluster.local"
          chmod 644 "$RUNNER_TEMP/community-rustfs-tls/rustfs_cert.pem" "$RUNNER_TEMP/community-rustfs-tls/rustfs_key.pem"
          docker run -d --name community-helm-rustfs --network kind \
            -e RUSTFS_ACCESS_KEY=zilobase \
            -e RUSTFS_SECRET_KEY="$rustfs_password" \
            -e RUSTFS_CORS_ALLOWED_ORIGINS=https://community.ga.invalid,zilo-desktop://app \
            -e RUSTFS_ADDRESS=:443 \
            -e RUSTFS_TLS_PATH=/certs \
            -v "$RUNNER_TEMP/community-rustfs-tls:/certs:ro" \
            rustfs/rustfs:1.0.2
          attempts=0
          until docker run --rm --network kind \
            -e RUSTFS_ACCESS_KEY=zilobase \
            -e RUSTFS_SECRET_KEY="$rustfs_password" \
            --entrypoint /bin/sh rustfs/rc:v0.1.36 -c \
            'rc alias set --insecure -- ga https://community-helm-rustfs "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" >/dev/null'; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 20 ]; then
              echo "RustFS did not accept authenticated requests after 20 attempts" >&2
              exit 1
            fi
            sleep 2
          done
          docker run --rm --network kind \
            -e RUSTFS_ACCESS_KEY=zilobase \
            -e RUSTFS_SECRET_KEY="$rustfs_password" \
            --entrypoint /bin/sh rustfs/rc:v0.1.36 -c \
            'rc alias set --insecure -- ga https://community-helm-rustfs "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" >/dev/null && rc bucket create --ignore-existing ga/zilobase >/dev/null && rc bucket version enable ga/zilobase >/dev/null'

          postgres_ip=$(docker inspect community-helm-postgres --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          rustfs_ip=$(docker inspect community-helm-rustfs --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          valkey_ip=$(docker inspect community-helm-valkey --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          node_ip=$(docker inspect community-helm-control-plane --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          echo "POSTGRES_IP=$postgres_ip" >> "$GITHUB_ENV"
          echo "RUSTFS_IP=$rustfs_ip" >> "$GITHUB_ENV"
          echo "VALKEY_IP=$valkey_ip" >> "$GITHUB_ENV"
          echo "NODE_IP=$node_ip" >> "$GITHUB_ENV"

          kubectl create namespace external
          kubectl create namespace community
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Service' \
            'metadata: { name: postgres, namespace: external }' \
            'spec:' \
            '  ports: [{ name: tcp, protocol: TCP, port: 5432, targetPort: 5432 }]' | kubectl apply -f -
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Service' \
            'metadata: { name: rustfs, namespace: external }' \
            'spec:' \
            '  ports: [{ name: https, protocol: TCP, port: 443, targetPort: 443 }]' | kubectl apply -f -
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Service' \
            'metadata: { name: valkey, namespace: external }' \
            'spec:' \
            '  ports: [{ name: redis, protocol: TCP, port: 6379, targetPort: 6379 }]' | kubectl apply -f -
          printf '%s\n' \
            'apiVersion: discovery.k8s.io/v1' \
            'kind: EndpointSlice' \
            'metadata:' \
            '  name: postgres-external' \
            '  namespace: external' \
            '  labels: { kubernetes.io/service-name: postgres }' \
            'addressType: IPv4' \
            "endpoints: [{ addresses: [\"$postgres_ip\"] }]" \
            'ports: [{ name: tcp, protocol: TCP, port: 5432 }]' | kubectl apply -f -
          printf '%s\n' \
            'apiVersion: discovery.k8s.io/v1' \
            'kind: EndpointSlice' \
            'metadata:' \
            '  name: rustfs-external' \
            '  namespace: external' \
            '  labels: { kubernetes.io/service-name: rustfs }' \
            'addressType: IPv4' \
            "endpoints: [{ addresses: [\"$rustfs_ip\"] }]" \
            'ports: [{ name: https, protocol: TCP, port: 443 }]' | kubectl apply -f -
          printf '%s\n' \
            'apiVersion: discovery.k8s.io/v1' \
            'kind: EndpointSlice' \
            'metadata:' \
            '  name: valkey-external' \
            '  namespace: external' \
            '  labels: { kubernetes.io/service-name: valkey }' \
            'addressType: IPv4' \
            "endpoints: [{ addresses: [\"$valkey_ip\"] }]" \
            'ports: [{ name: redis, protocol: TCP, port: 6379 }]' | kubectl apply -f -

          kubectl -n community create secret generic zilobase \
            --from-literal="DATABASE_URL=postgresql://zilobase:$postgres_password@postgres.external.svc.cluster.local:5432/zilobase" \
            --from-literal="BETTER_AUTH_SECRET=$(openssl rand -hex 32)" \
            --from-literal="ZILOBASE_BOOTSTRAP_TOKEN=$(openssl rand -hex 32)" \
            --from-literal="S3_ACCESS_KEY_ID=zilobase" \
            --from-literal="S3_SECRET_ACCESS_KEY=$rustfs_password"
          kubectl -n community create secret generic community-realtime \
            --from-literal="REALTIME_REDIS_URL=redis://valkey.external.svc.cluster.local:6379"
          kubectl -n community create configmap zilobase-test-ca \
            --from-file=ca.crt="$RUNNER_TEMP/community-rustfs-tls/rustfs_cert.pem"
      - name: Install and smoke Community chart
        shell: bash
        run: |
          set -euo pipefail
          helm upgrade --install community deploy/helm/zilobase -n community \
            --set "image.digest=$COMMUNITY_DIGEST" \
            --set image.pullPolicy=Never \
            --set config.externalUrl=https://community.ga.invalid \
            --set config.s3Endpoint=https://rustfs.external.svc.cluster.local \
            --set config.s3PublicEndpoint=https://rustfs.external.svc.cluster.local \
            --set config.s3Bucket=zilobase \
            --set config.smtpHost=smtp.ga.invalid \
            --set "networkPolicy.healthProbeCIDRs[0]=$NODE_IP/32" \
            --set "networkPolicy.postgresCIDR=$POSTGRES_IP/32" \
            --set "networkPolicy.s3CIDR=$RUSTFS_IP/32" \
            --set networkPolicy.smtpCIDR=192.0.2.10/32 \
            --set "realtime.existingSecret=community-realtime" \
            --set realtime.secretKey=REALTIME_REDIS_URL \
            --set "realtime.networkCIDR=$VALKEY_IP/32" \
            --set trustedCa.configMapName=zilobase-test-ca \
            --timeout 5m --wait
          pod=$(kubectl -n community get pod -l app.kubernetes.io/instance=community -o jsonpath='{.items[0].metadata.name}')
          for module in test-community-helm.mjs api-conformance.mjs cookie-jar.mjs; do
            kubectl -n community cp "scripts/selfhost/$module" "$pod:/tmp/$module"
          done
          kubectl -n community get secret zilobase -o json | kubectl -n community exec -i "$pod" -- \
            node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const j=JSON.parse(s);process.env.ZILOBASE_BOOTSTRAP_TOKEN=Buffer.from(j.data.ZILOBASE_BOOTSTRAP_TOKEN,"base64").toString();process.argv[2]="seed";await import("file:///tmp/test-community-helm.mjs")'
          kubectl -n community cp "$pod:/tmp/zilobase-community-helm-state.json" "$RUNNER_TEMP/zilobase-community-helm-state.json"
          test "$(docker exec community-helm-postgres psql -U zilobase -d zilobase -Atc 'select count(*) from drizzle.__zilobase_core_migrations;')" -gt 0
      - name: Paired empty-volume restore
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n community scale deployment community-zilobase --replicas=0
          kubectl -n community wait --for=delete pod -l app.kubernetes.io/instance=community --timeout=120s
          docker exec community-helm-postgres pg_dump -U zilobase -d zilobase --format=custom > "$RUNNER_TEMP/community.dump"
          docker stop community-helm-rustfs >/dev/null
          docker volume create community-helm-object-backup >/dev/null
          docker run --rm --volumes-from community-helm-rustfs:ro \
            -v community-helm-object-backup:/backup alpine:3.22 sh -c 'cp -a /data/. /backup/'

          postgres_password=$(docker inspect community-helm-postgres --format '{{range .Config.Env}}{{println .}}{{end}}' | awk -F= '$1=="POSTGRES_PASSWORD"{sub(/^[^=]*=/,"");print}')
          rustfs_password=$(docker inspect community-helm-rustfs --format '{{range .Config.Env}}{{println .}}{{end}}' | awk -F= '$1=="RUSTFS_SECRET_KEY"{sub(/^[^=]*=/,"");print}')
          old_postgres_volume=$(docker inspect community-helm-postgres | jq -r '.[0].Mounts[] | select(.Destination == "/var/lib/postgresql/data") | .Name')
          old_rustfs_volume=$(docker inspect community-helm-rustfs | jq -r '.[0].Mounts[] | select(.Destination == "/data") | .Name')
          docker rm -f community-helm-postgres community-helm-rustfs
          docker volume rm "$old_postgres_volume" "$old_rustfs_volume"

          docker volume create community-helm-postgres-restored >/dev/null
          docker run -d --name community-helm-postgres --network kind \
            -e POSTGRES_DB=zilobase -e POSTGRES_PASSWORD="$postgres_password" -e POSTGRES_USER=zilobase \
            -v community-helm-postgres-restored:/var/lib/postgresql/data zilobase-postgres:17.10-vector0.8.7
          until [ "$(docker exec community-helm-postgres psql -U zilobase -d postgres -Atc "select 1 from pg_database where datname = 'zilobase'" 2>/dev/null)" = 1 ]; do sleep 1; done
          docker exec -i community-helm-postgres pg_restore -U zilobase -d zilobase --no-owner --no-privileges < "$RUNNER_TEMP/community.dump"
          restored_postgres_ip=$(docker inspect community-helm-postgres --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')

          docker volume create community-helm-rustfs-restored >/dev/null
          docker run --rm -v community-helm-object-backup:/backup:ro \
            -v community-helm-rustfs-restored:/data alpine:3.22 sh -c 'cp -a /backup/. /data/ && chown -R 10001:10001 /data'
          docker run -d --name community-helm-rustfs --network kind \
            -e RUSTFS_ACCESS_KEY=zilobase -e RUSTFS_SECRET_KEY="$rustfs_password" \
            -e RUSTFS_CORS_ALLOWED_ORIGINS=https://community.ga.invalid,zilo-desktop://app \
            -e RUSTFS_ADDRESS=:443 -e RUSTFS_TLS_PATH=/certs \
            -v community-helm-rustfs-restored:/data \
            -v "$RUNNER_TEMP/community-rustfs-tls:/certs:ro" \
            rustfs/rustfs:1.0.2
          attempts=0
          until docker run --rm --network kind \
            -e RUSTFS_ACCESS_KEY=zilobase -e RUSTFS_SECRET_KEY="$rustfs_password" \
            --entrypoint /bin/sh rustfs/rc:v0.1.36 -c \
            'rc alias set --insecure -- ga https://community-helm-rustfs "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" >/dev/null'; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 20 ]; then
              echo "RustFS did not accept authenticated requests after 20 attempts" >&2
              exit 1
            fi
            sleep 2
          done
          restored_rustfs_ip=$(docker inspect community-helm-rustfs --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')

          kubectl -n external patch endpointslice postgres-external --type merge \
            -p "{\"endpoints\":[{\"addresses\":[\"$restored_postgres_ip\"]}]}"
          kubectl -n external patch endpointslice rustfs-external --type merge \
            -p "{\"endpoints\":[{\"addresses\":[\"$restored_rustfs_ip\"]}]}"
          helm upgrade community deploy/helm/zilobase -n community --reuse-values \
            --set "networkPolicy.postgresCIDR=$restored_postgres_ip/32" \
            --set "networkPolicy.s3CIDR=$restored_rustfs_ip/32" \
            --timeout 5m --wait
          pod=$(kubectl -n community get pod -l app.kubernetes.io/instance=community -o jsonpath='{.items[0].metadata.name}')
          for module in test-community-helm.mjs api-conformance.mjs cookie-jar.mjs; do
            kubectl -n community cp "scripts/selfhost/$module" "$pod:/tmp/$module"
          done
          kubectl -n community cp "$RUNNER_TEMP/zilobase-community-helm-state.json" "$pod:/tmp/zilobase-community-helm-state.json"
          kubectl -n community exec "$pod" -- node /tmp/test-community-helm.mjs verify
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods,jobs -A -o wide || true
          kubectl -n community describe pods || true
          kubectl -n community logs -l app.kubernetes.io/instance=community --all-containers --prefix --tail=200 || true
