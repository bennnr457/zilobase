name: zilobase

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      zilobase:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      ZILOBASE_SITE_ADDRESS: ${ZILOBASE_SITE_ADDRESS:?Set ZILOBASE_SITE_ADDRESS to the application domain}
      ZILOBASE_STORAGE_SITE_ADDRESS: ${ZILOBASE_STORAGE_SITE_ADDRESS:?Set ZILOBASE_STORAGE_SITE_ADDRESS to the object-storage domain}
    ports:
      - "${ZILOBASE_HTTP_PORT:-80}:80"
      - "${ZILOBASE_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 5

  zilobase: &app-service
    image: ${ZILOBASE_IMAGE:?Set ZILOBASE_IMAGE to an immutable release tag or digest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      queue-valkey:
        condition: service_healthy
    environment: &app-environment
      HOST: 0.0.0.0
      PORT: 3000
      ZILOBASE_PROCESS_ROLE: ${ZILOBASE_PROCESS_ROLE:-all}
      ZILOBASE_BACKGROUND_LANES: ${ZILOBASE_BACKGROUND_LANES:-}
      ZILOBASE_CELL_ID: ${ZILOBASE_CELL_ID:-default}
      ZILOBASE_OPERATIONS_TOKEN: ${ZILOBASE_OPERATIONS_TOKEN:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-zilobase-server}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      BACKGROUND_HEALTH_PORT: ${BACKGROUND_HEALTH_PORT:-3001}
      ZILOBASE_BACKGROUND_FAST_CONCURRENCY: ${ZILOBASE_BACKGROUND_FAST_CONCURRENCY:-8}
      ZILOBASE_BACKGROUND_AUTOMATION_CONCURRENCY: ${ZILOBASE_BACKGROUND_AUTOMATION_CONCURRENCY:-4}
      ZILOBASE_BACKGROUND_CALENDAR_CONCURRENCY: ${ZILOBASE_BACKGROUND_CALENDAR_CONCURRENCY:-2}
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://valkey:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://queue-valkey:6379}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET to at least 32 random characters}
      ZILOBASE_BOOTSTRAP_TOKEN: ${ZILOBASE_BOOTSTRAP_TOKEN:?Set ZILOBASE_BOOTSTRAP_TOKEN to at least 32 random characters}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL to the public application origin}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL to the public application origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DATABASE_AUTOMATIONS_ENABLED: ${DATABASE_AUTOMATIONS_ENABLED:-false}
      DATABASE_AUTOMATIONS_EXECUTION_DISABLED: ${DATABASE_AUTOMATIONS_EXECUTION_DISABLED:-true}
      AUTOMATION_WEBHOOKS_ENABLED: ${AUTOMATION_WEBHOOKS_ENABLED:-false}
      AUTOMATION_SLACK_ENABLED: ${AUTOMATION_SLACK_ENABLED:-false}
      AUTOMATION_SECRET_ENCRYPTION_KEY: ${AUTOMATION_SECRET_ENCRYPTION_KEY:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:-${BETTER_AUTH_SECRET}}
      IMAGE_STORAGE_MODE: s3
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT to the public object-storage origin}
      S3_BUCKET_NAME: ${RUSTFS_BUCKET:?Set RUSTFS_BUCKET}
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEARCH_EMBEDDINGS_ENABLED: ${SEARCH_EMBEDDINGS_ENABLED:-false}
      SEARCH_EMBEDDING_QUOTA_SCOPE: ${SEARCH_EMBEDDING_QUOTA_SCOPE:-default:gemini-embedding-2}
      SEARCH_EMBEDDING_RPM: ${SEARCH_EMBEDDING_RPM:-30}
      SEARCH_EMBEDDING_TPM: ${SEARCH_EMBEDDING_TPM:-100000}
      SEARCH_EMBEDDING_DAILY_TOKENS: ${SEARCH_EMBEDDING_DAILY_TOKENS:-10000000}
      SEARCH_EMBEDDING_WORKSPACE_DAILY_TOKENS: ${SEARCH_EMBEDDING_WORKSPACE_DAILY_TOKENS:-1000000}
      ZILOBASE_BACKGROUND_SEARCH_CONCURRENCY: ${ZILOBASE_BACKGROUND_SEARCH_CONCURRENCY:-4}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM to the production sender identity}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST to the production mail server}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:?Set SMTP_SECURE to true or false}
      SMTP_USER: ${SMTP_USER:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  search-worker:
    <<: *app-service
    profiles: [search-worker]
    environment:
      <<: *app-environment
      ZILOBASE_PROCESS_ROLE: worker
      ZILOBASE_BACKGROUND_LANES: search
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: ghcr.io/zilobase/postgres@sha256:8ba7c752d0567b22b8d33c5f87c663c82ea9fd693375cf754f01dd6082a0345b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.2
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${CLIENT_URL:?Set CLIENT_URL to the public application origin},zilo-desktop://app
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs-init:
    image: rustfs/rc:v0.1.36
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?Set RUSTFS_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        attempts=0
        until rc alias set -- zilobase http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 20 ]; then
            echo "Object storage did not accept authenticated requests after 20 attempts" >&2
            exit 1
          fi
          sleep 2
        done
        rc bucket create --ignore-existing "zilobase/$$RUSTFS_BUCKET"
        rc bucket anonymous set private "zilobase/$$RUSTFS_BUCKET"

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue-valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - queue_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  rustfs_data:
  queue_valkey_data:
